name: Build InfinityFree Upload ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Package InfinityFree files
        run: |
          cd dist
          zip -r ../infinityfree-website.zip .
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinityfree-website
          path: infinityfree-website.zip
          if-no-files-found: error
          retention-days: 7
